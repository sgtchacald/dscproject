#Configuracao Profile
spring.profiles.active=dev

#Versao da aplicacao (filtrado pelo Maven a partir do pom.xml)
app.version=@project.version@

#ADMIN inicial: a carga inicial cria um usuario ADMIN quando NAO ha nenhum ADMIN ativo.
# Credenciais via ambiente / .env (nunca versionar a senha). No .env, use:
#   APP_ADMIN_LOGIN  APP_ADMIN_EMAIL  APP_ADMIN_SENHA  APP_ADMIN_NOME  APP_ADMIN_OBRIGATORIO
# obrigatorio=true faz o boot FALHAR se nao ha ADMIN e a credencial esta ausente
# (recomendado em homologacao/producao). Default abaixo = false (so registra aviso).
app.admin.obrigatorio=false

#RBAC: se true, o sincronizador do catálogo de permissoes (codigo -> tabela PERMISSOES)
# roda a cada subida da aplicacao. Nunca apaga linha; so insere as que faltam e marca as orfas.
rbac.sync-catalogo-na-inicializacao=true

#Parametros Globais: se true, um parametro orfao (sem correspondente no catalogo
# do codigo) nao pode ter o valor editado pela tela. Default false: o valor pode
# ser ajustado, com aviso no modal, porque rotinas antigas podem ler o codigo.
parametros.orfao-edicao-bloqueada=false

#Remember-me: chave de assinatura do cookie de "Lembrar-me".
# Em homologacao/producao, sobreponha com a variavel de ambiente APP_REMEMBER_ME_KEY.
app.remember-me.key=dscproject-local-dev-key-trocar-em-producao

server.port=${SERVER_PORT:8081}

# Mensagens e Internacionalizacao (UTF-8 mandatorio)
spring.messages.basename=messages,labels
spring.messages.encoding=UTF-8

