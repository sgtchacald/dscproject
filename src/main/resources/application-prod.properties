# Perfil de PRODUCAO — ativado no container por SPRING_PROFILES_ACTIVE=prod.
# Nenhum segredo aqui: tudo vem do ambiente (arquivo .env da VPS, fora do git).
# Placeholder SEM default = obrigatorio: o boot falha se a variavel faltar.

#JPA
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Sem Flyway/Liquibase ainda: o schema e mantido pelo Hibernate. "update" so adiciona
# (nunca remove/renomeia coluna). O deploy.sh faz mysqldump antes de cada deploy.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

#MYSQL (servico "db" da rede interna do compose)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:db}:${MYSQL_PORTA:3306}/${MYSQL_BANCO}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USUARIO}
spring.datasource.password=${MYSQL_SENHA}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

#ADMIN inicial
app.admin.login=${APP_ADMIN_LOGIN:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.senha=${APP_ADMIN_SENHA:}
app.admin.nome=${APP_ADMIN_NOME:Administrador}
app.admin.obrigatorio=${APP_ADMIN_OBRIGATORIO:true}

#SEGREDOS obrigatorios
app.remember-me.key=${APP_REMEMBER_ME_KEY}

# Link do e-mail de recuperacao de senha
app.base-url=${APP_BASE_URL}

#EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.username=${GMAIL_APP_EMAIL}
spring.mail.password=${GMAIL_APP_SENHA}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#SERVIDOR (atras do Caddy, que termina o TLS)
server.port=8080
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never

#ACTUATOR — so health; o Caddy responde 404 para /actuator/** vindo da internet
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

#THYMELEAF
spring.thymeleaf.cache=true

#LOG
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
