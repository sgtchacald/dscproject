<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>

<div class="modal modal-blur fade" id="modalPerfil" tabindex="-1" th:fragment="modal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="formPerfil" novalidate class="d-flex flex-column h-100">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPerfilTitulo" th:text="#{perfil.modal.novo}">Novo perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body d-flex flex-column flex-grow-1" style="min-height: 0;">
                    <div id="alertaFormPerfil" class="alert alert-danger" style="display:none;"></div>
                    <input type="hidden" name="id" id="perfId">
                    
                    <!-- Dados básicos do perfil -->
                    <div class="row g-2 mb-2 flex-shrink-0 align-items-end">
                        <div class="col-12 col-sm-4 col-md-3 col-xl-2">
                            <label class="form-label required" for="perfCodigo" th:text="#{perfil.campo.codigo.label}">Código</label>
                            <input type="text" id="perfCodigo" name="codigo" class="form-control form-control-sm" maxlength="30">
                            <div class="invalid-feedback" id="erro-codigo"></div>
                        </div>
                        <div class="col-12 col-sm-8 col-md-4 col-xl-4">
                            <label class="form-label required" for="perfNome" th:text="#{perfil.campo.nome.label}">Nome</label>
                            <input type="text" id="perfNome" name="nome" class="form-control form-control-sm" maxlength="100">
                            <div class="invalid-feedback" id="erro-nome"></div>
                        </div>
                        <div class="col-12 col-md-5 col-xl-6">
                            <label class="form-label mb-1" for="perfDescricao" th:text="#{perfil.campo.descricao.label}">Descrição</label>
                            <textarea id="perfDescricao" name="descricao" class="form-control form-control-sm" rows="1" maxlength="255" style="resize:none;"></textarea>
                            <div class="invalid-feedback" id="erro-descricao"></div>
                        </div>
                    </div>

                    <!-- Seção de Permissões (Expansível ao maximizar) -->
                    <div class="seletor-permissoes-container d-flex flex-column flex-grow-1" style="min-height: 0;">
                        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-1">
                            <div class="d-flex align-items-center gap-2">
                                <label class="form-label mb-0 fw-bold" th:text="#{perfil.seletor.titulo}">Permissões do perfil</label>
                                <span class="badge bg-secondary-lt" id="contadorPermissoes"></span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <div class="input-icon" style="width: 200px;">
                                    <span class="input-icon-addon">
                                        <i class="ph ph-magnifying-glass"></i>
                                    </span>
                                    <input type="text" id="filtroPermissoes" class="form-control form-control-sm"
                                           placeholder="Filtrar permissões..." th:placeholder="#{perfil.seletor.filtrarPermissoes}" autocomplete="off">
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="btnMarcarTodasPermissoes" title="Marcar todas as permissões ativas">
                                    <i class="ph ph-check-square me-1"></i><span th:text="#{perfil.seletor.todas}">Todas</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="btnDesmarcarTodasPermissoes" title="Desmarcar todas as permissões">
                                    <i class="ph ph-square me-1"></i><span th:text="#{perfil.seletor.nenhuma}">Nenhuma</span>
                                </button>
                            </div>
                        </div>
                        <div class="invalid-feedback d-block m-0" id="erro-geral"></div>
                        <div id="seletorPermissoes" class="border rounded p-3 mt-1 flex-grow-1"></div>
                    </div>
                </div>
                <div class="modal-footer flex-shrink-0">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" th:text="#{perfil.modal.cancelar}">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSalvarPerfil" th:text="#{perfil.modal.salvar}">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
