<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{sistema/template-admin/layout}">
<head>
    <title>Dashboard Financeiro</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>

<div layout:fragment="cabecalho">
    <div th:replace="~{sistema/modulos/dashboards/fragments/cabecalho :: cabecalho(titulo='Dashboard', tipoAtivo='FINANCEIRO')}"></div>
</div>

<section layout:fragment="corpo" class="dashboard-container">

    <!-- Armazena a competência ativa para o JS poder usá-la nas requisições AJAX -->
    <input type="hidden" id="competenciaAtiva" th:value="${competencia}">

    <div class="row row-deck row-cards">
        <!-- LINHA 1 -->
        <div class="col-lg-3 mb-3" id="container-card1">
            <div class="card h-100 d-flex align-items-center justify-content-center p-4"><div class="spinner-border text-primary"></div></div>
        </div>
        <div class="col-lg-5 mb-3" id="container-card2">
            <div class="card h-100 d-flex align-items-center justify-content-center p-4"><div class="spinner-border text-primary"></div></div>
        </div>
        <div class="col-lg-4 mb-3" id="container-card7">
            <div class="card h-100 d-flex align-items-center justify-content-center p-4"><div class="spinner-border text-primary"></div></div>
        </div>

        <!-- LINHA 2 -->
        <div class="col-lg-6 mb-3" id="container-card3">
            <div class="card h-100 d-flex align-items-center justify-content-center p-4"><div class="spinner-border text-primary"></div></div>
        </div>
        <div class="col-lg-6 mb-3" id="container-card5">
            <div class="card h-100 d-flex align-items-center justify-content-center p-4"><div class="spinner-border text-primary"></div></div>
        </div>

        <!-- LINHA 3 -->
        <div class="col-lg-6 mb-3" id="container-card4">
            <div class="card h-100 d-flex align-items-center justify-content-center p-4"><div class="spinner-border text-primary"></div></div>
        </div>
        <div class="col-lg-6 mb-3" id="container-card6">
            <div class="card h-100 d-flex align-items-center justify-content-center p-4"><div class="spinner-border text-primary"></div></div>
        </div>

        <!-- LINHA 4 -->
        <div class="col-12 mb-3" id="container-card8">
            <div class="card h-100 d-flex align-items-center justify-content-center p-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</section>

<th:block layout:fragment="js">
    <script th:src="@{/js/dashboard/dashboard.js}"></script>
</th:block>

</body>
</html>
