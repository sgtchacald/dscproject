<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal" class="modal modal-blur fade" id="modalConectar" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="ph ph-bank me-2 text-primary"></i>
                    <span th:text="#{openfinance.modal.conectar.titulo}">Conectar Instituição Financeira</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body p-0 position-relative" style="min-height: 520px;">
                <div id="pluggyConnectLoading" class="text-center py-5">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <div class="text-secondary" th:text="#{openfinance.modal.conectar.carregando}">Inicializando widget seguro Pluggy Connect...</div>
                </div>
                <div id="pluggyConnectContainer" style="width: 100%; height: 550px;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
