# Build + testes (com MySQL real). Roda em feature/release/PR e e reutilizado pelo
# workflow "entrega" antes de gerar a imagem. Guia: docs/pipeline/pipeline-ci-cd.md
name: ci

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "release/**"
  workflow_call:
    inputs:
      publicar-jar:
        description: Publica o JAR como artifact para o job de imagem
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancela execucao antiga so no CI avulso; chamado pela "entrega", nunca cancela
  cancel-in-progress: ${{ github.workflow == 'ci' }}

jobs:
  build:
    name: build-e-testes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_ROOT_PASSWORD: ci-somente-teste
          MYSQL_DATABASE: dsc_test_bd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-somente-teste --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    env:
      # Banco descartavel do job; nao e segredo. Perfil de teste = dev + test.
      MYSQL_BANCO: dsc_test_bd
      MYSQL_USUARIO: root
      MYSQL_SENHA: ci-somente-teste
      GMAIL_APP_EMAIL: ci@example.invalid
      GMAIL_APP_SENHA: ci
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Relatorios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorios-teste
          path: target/surefire-reports/
          retention-days: 7

      - name: Publica JAR
        if: inputs.publicar-jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 3
